name: curiosity
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_markdown_plus: ^1.0.12
  google_fonts: ^8.0.0
  web_socket_client: ^0.2.1
  markdown: ^7.2.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  pdf: ^3.13.1
  printing: ^5.15.1
  web: ^1.1.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  archive: ^4.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/logo.jpg